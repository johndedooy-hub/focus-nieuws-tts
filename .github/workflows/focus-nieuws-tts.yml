name: Focus Nieuws TTS

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    env:
      KOKORO_VOICE: af_storm
      KOKORO_API_KEY: ${{ secrets.KOKORO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxml2-utils curl

      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip
          # install whisper, kokoro (if available), and a reliable fallback gTTS
          pip3 install -U openai-whisper kokoro gTTS || true

      - name: Download newest MP3 from RSS
        run: |
          RSS_URL="https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss"
          AUDIO_URL=$(curl -sL "$RSS_URL" | xmllint --xpath 'string(//item[1]/enclosure/@url)' -)
          echo "Nieuwste MP3 URL: $AUDIO_URL"
          curl -L -s "$AUDIO_URL" -o raw_nieuws.mp3
          if [ ! -s raw_nieuws.mp3 ]; then
            echo "Download mislukt"
            exit 1
          fi

      - name: Transcribe audio with Whisper Medium
        run: |
          python3 - <<'PY'
          import whisper
          model = whisper.load_model("medium")
          result = model.transcribe("raw_nieuws.mp3")
          with open("nieuws.txt", "w", encoding="utf-8") as f:
              f.write(result.get("text", "").strip())
          PY

      - name: Build TTS audio (kokoro preferred, gTTS fallback) + vocal processing
        env:
          KOKORO_API_KEY: ${{ secrets.KOKORO_API_KEY }}
          KOKORO_VOICE: ${{ env.KOKORO_VOICE }}
        run: |
          python3 - <<'PY'
          import os, sys
          
          # Read the transcribed text
          with open("nieuws.txt", "r", encoding="utf-8") as f:
              nieuws = f.read().strip()
          
          intro = "Welkom bij het Focus Fantastique Update Nieuws."
          outro = "Terug naar de lekkerste muziek, tot over een half uur."
          full_text = f"{intro}\n\n{nieuws}\n\n{outro}"
          
          out_raw = "Focus_Fantastique_tts_raw.mp3"
          kokoro_api_key = os.getenv("KOKORO_API_KEY", "")
          used = False
          
          # Try Kokoro if API key present
          if kokoro_api_key:
              try:
                  from kokoro import TTS
                  voice = os.getenv("KOKORO_VOICE", "af_storm")
                  tts = TTS(voice=voice)
                  tts.save(full_text, out_raw)
                  print("Saved raw TTS using kokoro ->", out_raw)
                  used = True
              except Exception as e:
                  print("kokoro failed:", e)
                  used = False
          
          # Fallback to gTTS if kokoro not used / failed
          if not used:
              try:
                  from gtts import gTTS
                  gTTS(full_text, lang='nl').save(out_raw)
                  print("Saved raw TTS using gTTS ->", out_raw)
                  used = True
              except Exception as e:
                  print("gTTS failed:", e)
                  sys.exit(1)
          PY

          # Post-process with ffmpeg to produce a deeper, more dynamic, human-like male tone:
          # - lower pitch slightly (asetrate) then resample and correct tempo (atempo)
          # - boost low mids, reduce harsh highs
          # - apply gentle compression, dynamic normalization, and a subtle echo (space)
          ffmpeg -y -i Focus_Fantastique_tts_raw.mp3 -af "asetrate=44100*0.86,aresample=44100,atempo=1.03,equalizer=f=120:t=q:w=1:g=5,equalizer=f=500:t=q:w=1:g=2,equalizer=f=4000:t=q:w=1:g=-3,acompressor=threshold=-18dB:ratio=4:attack=5:release=200,dynaudnorm,aecho=0.6:0.6:1000:0.25" Focus_Fantastique_tts.mp3

      - name: Embed cover image
        run: |
          if [ -f Focus_Fantastique_tts.mp3 ] && [ -f FocusFantastiqueNieuws.jpg ]; then
            ffmpeg -y -i Focus_Fantastique_tts.mp3 \
              -i FocusFantastiqueNieuws.jpg \
              -map 0:a -map 1:v \
              -c:a copy -c:v mjpeg \
              -metadata:s:v title="Album cover" \
              -metadata:s:v comment="Cover image" \
              Focus_Fantastique_tts_cover.mp3
            mv Focus_Fantastique_tts_cover.mp3 Focus_Fantastique_tts.mp3
          else
            echo "Geen audio of cover gevonden, cover embed overgeslagen"
          fi

      - name: Commit and Push update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f Focus_Fantastique_tts.mp3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Focus_Fantastique_tts.mp3
            git commit -m "Update Focus Fantastique TTS Nieuws" || echo "no changes to commit"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            BRANCH="${GITHUB_REF#refs/heads/}"
            if [ -z "$BRANCH" ]; then
              BRANCH="main"
            fi
            git push origin HEAD:"$BRANCH" || echo "git push failed"
          else
            echo "Geen outputbestand, commit overgeslagen"
          fi
