name: RSS to Text TEST

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install torchcodec
          python -m pip install "transformers<4.40.0" "scipy<1.13.0" feedparser pydub mutagen requests python-dateutil faster-whisper TTS
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: Fetch Latest RSS Bulletin and Generate Filenames
        env:
          RSS_URL: 'https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss'
          COVER_IMAGE: 'FocusFantastiqueNieuws.jpg'
        run: |
          python3 - <<'EOF'
          import feedparser
          import requests
          import os
          from pydub import AudioSegment
          from pydub.effects import normalize

          rss_url = os.environ['RSS_URL']
          feed = feedparser.parse(rss_url)

          if not feed.entries:
              print("Geen afleveringen gevonden.")
              exit(1)

          latest_entry = feed.entries[0]
          audio_url = None

          for enclosure in latest_entry.get('enclosures', []):
              if enclosure.type and enclosure.type.startswith('audio/'):
                  audio_url = enclosure.href
                  break

          if not audio_url:
              print("Geen audio gevonden.")
              exit(1)

          output_mp3 = 'Focus_Fantastique_tts-1.mp3'
          output_txt = 'Focus_Fantastique_tts-1.txt'
          temp_audio = 'temp_audio.mp3'
          processed_orig = 'orig_processed.mp3'

          audio_response = requests.get(audio_url)
          audio_response.raise_for_status()

          with open(temp_audio, 'wb') as f:
              f.write(audio_response.content)

          audio = AudioSegment.from_file(temp_audio)

          trim_start_ms = 5400
          trim_end_ms = int(5.9 * 1000)
          total_duration = len(audio)
          trim_end_point = max(0, total_duration - trim_end_ms)

          if trim_start_ms < trim_end_point:
              trimmed_audio = audio[trim_start_ms:trim_end_point]
          else:
              trimmed_audio = audio

          faded_audio = trimmed_audio.fade_in(1000).fade_out(1000)
          normalized_audio = normalize(faded_audio)

          normalized_audio.export(processed_orig, format='mp3', bitrate='128k')

          os.remove(temp_audio)

          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f"OUTPUT_MP3={output_mp3}\n")
              env_file.write(f"OUTPUT_TXT={output_txt}\n")
              env_file.write(f"PROCESSED_AUDIO={processed_orig}\n")
          EOF

      - name: Transcribe audio with Whisper (STT)
        run: |
          python3 - <<'EOF'
          from faster_whisper import WhisperModel
          import os

          processed_audio = os.environ.get('PROCESSED_AUDIO')
          output_txt = os.environ.get('OUTPUT_TXT')

          model = WhisperModel("medium", device="cpu", compute_type="int8")
          segments, _ = model.transcribe(processed_audio, language="nl", beam_size=5, vad_filter=True)

          text_parts = [segment.text.strip() for segment in segments if segment.text.strip()]
          full_text = " ".join(text_parts)

          with open(output_txt, "w", encoding="utf-8") as f:
              f.write(full_text + "\n")
          EOF
          
      - name: Generate High-Quality NL Voice (XTTS-v2 Open-Source)
        env:
          COVER_IMAGE: 'FocusFantastiqueNieuws.jpg'
          COQUI_TOS_AGREED: '1'
        run: |
          python3 - <<'EOF'
          from TTS.api import TTS
          from pydub import AudioSegment
          from pydub.effects import normalize
          import os
          import math
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError

          # SAFE GLOBALS FIX (PyTorch 2.6)
          try:
              import torch
              registered = []

              # XTTS configs
              try:
                  from TTS.tts.configs.xtts_config import XttsConfig
                  registered.append(XttsConfig)
              except:
                  pass

              try:
                  from TTS.tts.models.xtts import XttsAudioConfig
                  registered.append(XttsAudioConfig)
              except:
                  pass

              # REQUIRED: XttsArgs
              try:
                  from TTS.tts.models.xtts import XttsArgs
                  registered.append(XttsArgs)
              except:
                  pass

              # REQUIRED: BaseDatasetConfig
              try:
                  from TTS.config.shared_configs import BaseDatasetConfig
                  registered.append(BaseDatasetConfig)
              except:
                  pass

              torch.serialization.add_safe_globals(registered)
          except Exception as e:
              print("Kon safe globals niet registreren:", e)

          output_txt = os.environ.get('OUTPUT_TXT')
          output_mp3 = os.environ.get('OUTPUT_MP3')

          with open(output_txt, "r", encoding="utf-8") as f:
              text = f.read().strip()

          speaker_wav = "stem_voorbeeld.wav"
          raw_output = "raw_ai_voice.wav"

          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2")

          tts.tts_to_file(
              text=text,
              speaker_wav=speaker_wav,
              language="nl",
              speed="1.15"
              file_path=raw_output
          )

          voice_sound = AudioSegment.from_file(raw_output)
          voice_sound = normalize(voice_sound)

          newsbed_path = "newsbed-1.mp3"
          if os.path.exists(newsbed_path):
              newsbed = AudioSegment.from_file(newsbed_path) - 15
              if len(newsbed) < len(voice_sound):
                  newsbed *= math.ceil(len(voice_sound) / len(newsbed))
              newsbed = newsbed[:len(voice_sound)]
              combined = newsbed.overlay(voice_sound)
          else:
              combined = voice_sound

          combined.export(output_mp3, format='mp3', bitrate='128k')

          try:
              id3 = ID3(output_mp3)
          except ID3NoHeaderError:
              id3 = ID3()

          id3.add(TIT2(encoding=3, text="FocusFantastique Nieuws Update"))
          id3.add(TALB(encoding=3, text="FocusFantastique Nieuws Update"))

          cover_image = os.environ.get('COVER_IMAGE')
          if cover_image and os.path.exists(cover_image):
              with open(cover_image, 'rb') as img:
                  id3.add(APIC(encoding=3, mime='image/jpeg', type=3, desc='Cover', data=img.read()))

          id3.save(output_mp3)

          os.remove(raw_output)
          EOF
          
      - name: Cleanup old temporary files
        run: |
          rm -f orig_processed.mp3 2>/dev/null || true
          echo "Cleanup voltooid"

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add Focus_Fantastique_tts-1.mp3 Focus_Fantastique_tts-1.txt || true

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "Update: FocusFantastique Nieuws Update - UTC+2 $(date '+%H:%M')"
            git push
          fi
          
