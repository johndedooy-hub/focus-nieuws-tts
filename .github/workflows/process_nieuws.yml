name: Process and Host Nieuws MP3

on:
  schedule:
    - cron: '*/15 * * * *'   # elk kwartier om :15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl libxml2-utils bc

      - name: Download newest MP3 from RSS
        run: |
          RSS_URL="https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss"

          # Pak ALTIJD de nieuwste aflevering via XML parser
          AUDIO_URL=$(curl -sL "$RSS_URL" | xmllint --xpath 'string(//item[1]/enclosure/@url)' -)

          echo "Nieuwste MP3 URL: $AUDIO_URL"

          curl -L -s "$AUDIO_URL" -o raw_nieuws.mp3

          if [ ! -s raw_nieuws.mp3 ]; then
            echo "Download mislukt"
            exit 1
          fi
              
      - name: Process audio (crop + fade)
      
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_nieuws.mp3)

          if ! [[ "$DURATION" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Duration error"
            exit 1
          fi

          # Jouw vaste crop-tijden
          CUT_START=5.5
          CUT_END=$(awk "BEGIN {print $DURATION - 10.9}")  # 5 sec start + 1 sec fade-out

          if (( $(echo "$CUT_END < 1" | bc -l) )); then
            echo "Audio te kort"
            exit 1
          fi

          ffmpeg -y -ss $CUT_START -i raw_nieuws.mp3 -t $CUT_END \
            -af "afade=t=in:ss=0:d=1,afade=t=out:st=$(awk "BEGIN {print $CUT_END - 1}"):d=1" \
            Focus_Fantastique_Nieuws_en_Weer.mp3

          rm raw_nieuws.mp3
          
      - name: Set MP3 metadata
        run: |
          ffmpeg -y -i Focus_Fantastique_Nieuws_en_Weer.mp3 \
            -metadata artist="Focus Fantastique ANP nieuws" \
            -metadata album="Focus Fantastique ANP update" \
            -codec copy Focus_Fantastique_Nieuws_en_Weer_tagged.mp3

          mv Focus_Fantastique_Nieuws_en_Weer_tagged.mp3 Focus_Fantastique_Nieuws_en_Weer.mp3
          
      - name: Embed cover image
        run: |
          ffmpeg -y -i Focus_Fantastique_Nieuws_en_Weer.mp3 \
            -i FocusFantastiqueNieuws.jpg \
            -map 0:a -map 1:v \
            -c:a copy -c:v mjpeg \
            -metadata:s:v title="Album cover" \
            -metadata:s:v comment="Cover image" \
            Focus_Fantastique_Nieuws_en_Weer_cover.mp3

          mv Focus_Fantastique_Nieuws_en_Weer_cover.mp3 Focus_Fantastique_Nieuws_en_Weer.mp3
          
      - name: Commit and Push update
        run: |
          if [ -f Focus_Fantastique_Nieuws_en_Weer.mp3 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add Focus_Fantastique_Nieuws_en_Weer.mp3
            git commit -m "Update Focus Fantastique Nieuws en Weer" || exit 0
            git push
          else
            echo "Geen outputbestand, commit overgeslagen"
          fi
