#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
process_nieuws.py
Volledige, robuuste pipeline om:
- nieuwste MP3 van RSS te downloaden
- te transcriberen met Whisper (medium)
- TTS te genereren met Kokoro (af_storm)
- intro + nieuws + outro samen te voegen
- cover in te bedden
- output MP3 te schrijven: Focus_Fantastique_tts.mp3
- (optioneel) te committen en pushen naar git

Gebruik:
  python3 process_nieuws.py

Zorg dat:
- ffmpeg, curl, xmllint aanwezig zijn op het systeem
- Python packages: whisper, kokoro (of jouw lokale client) geïnstalleerd zijn
- FocusFantastiqueNieuws.jpg in repo aanwezig is
"""

from __future__ import annotations
import os
import sys
import subprocess
import logging
import tempfile
import shutil
from pathlib import Path

# Externe libs
try:
    import whisper
except Exception as e:
    print("Import whisper failed:", e)
    raise

# Kokoro client import - pas aan als jouw client andere naam/API heeft
try:
    from kokoro import TTS
except Exception as e:
    # Geef duidelijke foutmelding zodat gebruiker weet wat te veranderen
    print("Import kokoro failed:", e)
    print("Controleer of jouw kokoro Python client beschikbaar is en importeerbaar als 'from kokoro import TTS'")
    raise

# Configuratie
RSS_URL = (
    "https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/"
    "84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss"
)
OUTPUT_MP3 = "Focus_Fantastique_tts.mp3"
COVER_FILE = "FocusFantastiqueNieuws.jpg"
INTRO_TEXT = "Welkom bij het Focus Fantastique Nieuws, ik ben John Nagtzaam."
OUTRO_TEXT = "Dit was het hele nieuws en weer op Focus Fantastique, nu terug naar de muziek."
WHISPER_MODEL = "medium"
KOKORO_VOICE = "af_storm"

# Logging
logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s %(levelname)s %(message)s",
    datefmt="%Y-%m-%d %H:%M:%S",
)


def run_cmd(cmd: list[str], check: bool = True, capture_output: bool = False) -> subprocess.CompletedProcess:
    """Run a shell command safely."""
    logging.debug("Run command: %s", " ".join(cmd))
    return subprocess.run(cmd, check=check, capture_output=capture_output, text=True)


def download_latest_mp3(rss_url: str, dest: Path) -> Path:
    """Download the newest MP3 from the RSS feed to dest/raw_nieuws.mp3."""
    logging.info("Ophalen nieuwste MP3 URL uit RSS")
    # Gebruik xmllint om enclosure url te pakken
    try:
        proc = run_cmd(
            ["bash", "-lc", f"curl -sL '{rss_url}' | xmllint --xpath 'string(//item[1]/enclosure/@url)' -"],
            capture_output=True,
        )
        audio_url = proc.stdout.strip()
    except subprocess.CalledProcessError as e:
        logging.error("Fout bij ophalen RSS: %s", e)
        raise

    if not audio_url:
        raise RuntimeError("Kon geen audio URL vinden in RSS")

    logging.info("Gevonden audio URL: %s", audio_url)
    out_file = dest / "raw_nieuws.mp3"
    logging.info("Downloaden naar %s", out_file)
    try:
        run_cmd(["curl", "-L", "-s", audio_url, "-o", str(out_file)])
    except subprocess.CalledProcessError as e:
        logging.error("Download mislukt: %s", e)
        raise

    if not out_file.exists() or out_file.stat().st_size == 0:
        raise RuntimeError("Download mislukt of bestand leeg")

    logging.info("Download voltooid")
    return out_file


def transcribe_with_whisper(audio_path: Path, model_name: str, out_txt: Path) -> Path:
    """Transcribe audio using whisper and write to out_txt."""
    logging.info("Laden Whisper model: %s", model_name)
    model = whisper.load_model(model_name)
    logging.info("Transcriberen %s", audio_path)
    result = model.transcribe(str(audio_path))
    text = result.get("text", "").strip()
    logging.info("Transcriptie lengte: %d tekens", len(text))
    out_txt.write_text(text, encoding="utf-8")
    logging.info("Transcriptie opgeslagen in %s", out_txt)
    return out_txt


def build_tts_with_kokoro(text: str, voice: str, out_mp3: Path) -> Path:
    """Generate TTS using Kokoro client and save to out_mp3."""
    logging.info("Genereren TTS met Kokoro voice=%s", voice)
    tts = TTS(voice=voice)
    # Verwacht dat TTS.save(text, filename) beschikbaar is; pas aan indien nodig
    tts.save(text, str(out_mp3))
    if not out_mp3.exists() or out_mp3.stat().st_size == 0:
        raise RuntimeError("Kokoro TTS productie faalde of bestand leeg")
    logging.info("TTS opgeslagen in %s", out_mp3)
    return out_mp3


def embed_cover(audio_mp3: Path, cover_file: Path, out_with_cover: Path) -> Path:
    """Embed cover image into MP3 using ffmpeg."""
    logging.info("Embed cover %s in %s", cover_file, audio_mp3)
    if not cover_file.exists():
        logging.warning("Cover bestand niet gevonden: %s. Skip embed.", cover_file)
        # fallback: kopieer origineel
        shutil.copy2(audio_mp3, out_with_cover)
        return out_with_cover

    cmd = [
        "ffmpeg",
        "-y",
        "-i",
        str(audio_mp3),
        "-i",
        str(cover_file),
        "-map",
        "0:a",
        "-map",
        "1:v",
        "-c:a",
        "copy",
        "-c:v",
        "mjpeg",
        "-metadata:s:v",
        "title=Album cover",
        "-metadata:s:v",
        "comment=Cover image",
        str(out_with_cover),
    ]
    run_cmd(cmd)
    if not out_with_cover.exists():
        raise RuntimeError("ffmpeg embed cover faalde")
    logging.info("Cover succesvol ingebed in %s", out_with_cover)
    return out_with_cover


def git_commit_and_push(file_to_commit: Path, message: str = "Update Focus Fantastique TTS Nieuws") -> None:
    """Commit en push het bestand naar de huidige git repo (optioneel)."""
    logging.info("Commit en push %s", file_to_commit)
    try:
        run_cmd(["git", "config", "--global", "user.name", "github-actions[bot]"])
        run_cmd(["git", "config", "--global", "user.email", "github-actions[bot]@users.noreply.github.com"])
        run_cmd(["git", "add", str(file_to_commit)])
        # commit kan falen als er niets te committen is; negeer dat
        run_cmd(["git", "commit", "-m", message], check=False)
        run_cmd(["git", "push"], check=False)
        logging.info("Git push uitgevoerd (indien geconfigureerd en permissies aanwezig)")
    except Exception as e:
        logging.warning("Git commit/push faalde: %s", e)


def main() -> int:
    logging.info("Start process_nieuws pipeline")
    base = Path.cwd()
    tmpdir = Path(tempfile.mkdtemp(prefix="focus_nieuws_"))
    logging.info("Werkmap: %s", tmpdir)

    try:
        # 1) Download nieuwste MP3
        raw_mp3 = download_latest_mp3(RSS_URL, tmpdir)

        # 2) Transcribe met Whisper
        transcript_file = tmpdir / "nieuws.txt"
        transcribe_with_whisper(raw_mp3, WHISPER_MODEL, transcript_file)

        # 3) Bouw volledige tekst met intro/outro
        nieuws_text = transcript_file.read_text(encoding="utf-8").strip()
        full_text = f"{INTRO_TEXT}\n\n{nieuws_text}\n\n{OUTRO_TEXT}"
        logging.info("Volledige tekst lengte: %d tekens", len(full_text))

        # 4) Genereer TTS met Kokoro
        tts_tmp = tmpdir / "Focus_Fantastique_tts_raw.mp3"
        build_tts_with_kokoro(full_text, KOKORO_VOICE, tts_tmp)

        # 5) Embed cover (gebruik cover uit repo)
        cover_path = base / COVER_FILE
        final_tmp = tmpdir / "Focus_Fantastique_tts_cover.mp3"
        embed_cover(tts_tmp, cover_path, final_tmp)

        # 6) Verplaats naar werkmap (repo root)
        final_out = base / OUTPUT_MP3
        shutil.copy2(final_tmp, final_out)
        logging.info("Eindbestand geschreven naar %s", final_out)

        # 7) Commit & push (optioneel)
        git_commit_and_push(final_out)

        logging.info("Pipeline voltooid")
        return 0

    except Exception as exc:
        logging.exception("Pipeline faalde: %s", exc)
        return 2

    finally:
        # cleanup
        try:
            shutil.rmtree(tmpdir)
            logging.debug("Verwijder tijdelijke map %s", tmpdir)
        except Exception:
            pass


if __name__ == "__main__":
    sys.exit(main())
    
