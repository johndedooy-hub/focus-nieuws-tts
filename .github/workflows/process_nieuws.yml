name: Process and Host TTS Nieuws MP3

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl libxml2-utils bc python3 python3-pip
          python3 -m pip install --upgrade pip
          pip3 install -U openai-whisper

      - name: Download newest MP3 from RSS
        run: |
          RSS_URL="https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss"

          AUDIO_URL=$(curl -sL "$RSS_URL" | xmllint --xpath 'string(//item[1]/enclosure/@url)' -)

          echo "Nieuwste MP3 URL: $AUDIO_URL"

          curl -L -s "$AUDIO_URL" -o raw_nieuws.mp3

          if [ ! -s raw_nieuws.mp3 ]; then
            echo "Download mislukt"
            exit 1
          fi

      - name: Transcribe audio with Whisper Medium
        run: |
          python3 - <<'PY'
          import whisper
          model = whisper.load_model("medium")
          result = model.transcribe("raw_nieuws.mp3")
          with open("nieuws.txt", "w", encoding="utf-8") as f:
          f.write(result["text"].strip())
          PY
          
      - name: Build TTS audio with Kokoro
        run: |
          python3 - <<'PY'
          try:from kokoro import TTS
          except Exception as e:
          print("Kokoro import failed:", e)
          raise
          intro = "Welkom bij het Focus Fantastique Nieuws, ik ben John Nagtzaam."
          outro = "Dit was het hele nieuws en weer op Focus Fantastique, nu terug naar de muziek."
          with open("nieuws.txt", "r", encoding="utf-8"
          nieuws = f.read().strip()
          full_text = f"{intro}\n\n{nieuws}\n\n{outro}"
          tts = TTS(voice="af_storm")
          tts.save(full_text, "Focus_Fantastique_tts.mp3"
          PY
        
      - name: Embed cover image
       run: |
             if [ -f Focus_Fantastique_tts.mp3 ] && [ -f FocusFantastiqueNieuws.jpg ]; then
             ffmpeg -y -i Focus_Fantastique_tts.mp3 \
             -i FocusFantastiqueNieuws.jpg \
              -map 0:a -map 1:v \
              -c:a copy -c:v mjpeg \
              -metadata:s:v title="Album cover" \
              -metadata:s:v comment="Cover image" \
              Focus_Fantastique_tts_cover.mp3
              mv Focus_Fantastique_tts_cover.mp3 Focus_Fantastique_tts.mp3
              
              else
              echo "Geen audio of cover gevonden, cover embed overgeslagen"
             fi
          
      - name: Commit and Push update
        run: |
          if [ -f Focus_Fantastique_tts.mp3 ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add Focus_Fantastique_tts.mp3
            git commit -m "Update Focus Fantastique TTS Nieuws" || true
            git push
          else
            echo "Geen outputbestand, commit overgeslagen"
          fi

          
