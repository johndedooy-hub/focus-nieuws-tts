name: RSS to Text to XTTSv2 FAST

on:
  workflow_dispatch:

jobs:
  process-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache TTS models
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/tts
            ~/.cache/faster_whisper
          key: tts-whisper-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install torchcodec
          python -m pip install "transformers<4.40.0" "scipy<1.13.0" feedparser pydub mutagen requests python-dateutil faster-whisper TTS
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run FAST pipeline
        env:
          RSS_URL: 'https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d746db/podcast.rss'
          COVER_IMAGE: 'FocusFantastiqueNieuws.jpg'
          XTTS_SPEED: '1.35'
          COQUI_TOS_AGREED: '1'
          COQUI_STUDIO_FORCE_TOS: '1'
        run: |
          # TOS FIX — SHELL OMGEVING
          export COQUI_TOS_AGREED=1
          export COQUI_STUDIO_FORCE_TOS=1

          python3 - <<'EOF'
          import os
          import math
          import requests
          import feedparser
          from pydub import AudioSegment, effects
          from faster_whisper import WhisperModel
          from TTS.api import TTS
          from mutagen.id3 import ID3, TIT2, TALB, APIC, ID3NoHeaderError

          # TOS FIX — PYTHON OMGEVING
          os.environ["COQUI_TOS_AGREED"] = "1"
          os.environ["COQUI_STUDIO_FORCE_TOS"] = "1"

          # SAFE GLOBALS FIX
          import torch
          from TTS.tts.configs.xtts_config import XttsConfig
          from TTS.tts.models.xtts import XttsAudioConfig, XttsArgs
          from TTS.config.shared_configs import BaseDatasetConfig

          torch.serialization.add_safe_globals([
              XttsConfig,
              XttsAudioConfig,
              XttsArgs,
              BaseDatasetConfig
          ])

          print("XTTS safe globals + TOS OK")

          # PRELOAD XTTS
          print("XTTS laden...")
          tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2")

          # PRELOAD WHISPER
          print("Whisper laden...")
          whisper = WhisperModel("medium", device="cpu", compute_type="int8")

          # FETCH RSS AUDIO
          rss_url = os.environ["RSS_URL"]
          feed = feedparser.parse(rss_url)
          latest = feed.entries[0]

          audio_url = None
          for enclosure in latest.get("enclosures", []):
              if enclosure.type and enclosure.type.startswith("audio/"):
                  audio_url = enclosure.href
                  break

          audio_data = requests.get(audio_url).content
          with open("temp.mp3", "wb") as f:
              f.write(audio_data)

          audio = AudioSegment.from_file("temp.mp3")

          # TRIM + NORMALIZE
          trimmed = audio[5400:len(audio) - int(5.9 * 1000)]
          faded = trimmed.fade_in(1000).fade_out(1000)
          normalized = effects.normalize(faded)
          normalized.export("processed.mp3", format="mp3", bitrate="128k")

          # TRANSCRIBE (NO EMPTY LINES)
          segments, _ = whisper.transcribe("processed.mp3", language="nl", beam_size=5, vad_filter=True)

          lines = []
          for seg in segments:
              text = seg.text.strip()
              if not text:
                  continue
              if not text.endswith((".", "!", "?")):
                  text += "."
              lines.append(text)

          transcript = "\n".join(lines)
          with open("Focus_Fantastique_tts-1.txt", "w", encoding="utf-8") as f:
              f.write(transcript)

          # CLEAN SPEAKER WAV
          speaker = AudioSegment.from_file("stem_voorbeeld.wav")
          speaker = effects.normalize(speaker)
          speaker = speaker.low_pass_filter(9000)
          speaker = speaker.compress_dynamic_range(threshold=-18.0, ratio=1.2)
          speaker = speaker.high_pass_filter(120)
          speaker.export("clean_speaker.wav", format="wav")

          # XTTS VOICE CLONE
          speed = float(os.environ.get("XTTS_SPEED", "1.0"))

          tts.tts_to_file(
              text=transcript,
              speaker_wav="clean_speaker.wav",
              language="nl",
              file_path="raw.wav",
              speed=speed
          )

          voice = AudioSegment.from_file("raw.wav")
          voice = effects.normalize(voice)

          # MIX WITH NEWSBED
          if os.path.exists("newsbed-1.mp3"):
              bed = AudioSegment.from_file("newsbed-1.mp3") - 15
              if len(bed) < len(voice):
                  bed *= math.ceil(len(voice) / len(bed))
              bed = bed[:len(voice)]
              final = bed.overlay(voice)
          else:
              final = voice

          final.export("Focus_Fantastique_tts-1.mp3", format="mp3", bitrate="128k")

          # ADD COVER
          try:
              id3 = ID3("Focus_Fantastique_tts-1.mp3")
          except ID3NoHeaderError:
              id3 = ID3()

          id3.add(TIT2(encoding=3, text="FocusFantastique Nieuws Update"))
          id3.add(TALB(encoding=3, text="FocusFantastique Nieuws Update"))

          cover = os.environ["COVER_IMAGE"]
          if os.path.exists(cover):
              with open(cover, "rb") as img:
                  id3.add(APIC(encoding=3, mime="image/jpeg", type=3, desc="Cover", data=img.read()))

          id3.save("Focus_Fantastique_tts-1.mp3")

          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add Focus_Fantastique_tts-1.mp3 Focus_Fantastique_tts-1.txt || true
          git pull origin main --rebase || true

          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "FAST Update: FocusFantastique Nieuws Update - UTC+2 $(date '+%H:%M')"
            git push
          fi
          
