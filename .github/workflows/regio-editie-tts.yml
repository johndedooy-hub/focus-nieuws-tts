name: Focus Regio News TTS (editie 1 of 2)

# Wordt gestart vanuit CMB > Regioagenda (of handmatig op GitHub: Run workflow, editie 1 of 2).
run-name: Regio editie ${{ inputs.edition }}

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Editie (1 of 2)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      txt_url:
        description: 'Adres van het tekstbestand (leeg = standaard)'
        required: false
        default: ''

env:
  EDITION: ${{ inputs.edition }}
  TXT_URL: ${{ inputs.txt_url }}

jobs:
  generate-news-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade git+https://github.com/rany2/edge-tts.git pydub mutagen requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download transcript from website
        run: |
          URL="${TXT_URL:-https://www.focusfantastique.nl/ff-regioagenda-${EDITION}.txt}"
          wget --quiet "${URL}?t=$(date +%s)" -O ff-regioagenda.txt

          if [ ! -f "ff-regioagenda.txt" ]; then
            echo "ERROR: Failed to download transcript from website"
            exit 1
          fi

          echo "Transcript (editie ${EDITION}) downloaded successfully:"
          ls -lh ff-regioagenda.txt

      - name: Check newsbed
        run: |
          if [ ! -f "newsbed.mp3" ]; then
            echo "ERROR: newsbed.mp3 not found"
            exit 1
          fi

          echo "Newsbed found:"
          ls -lh newsbed.mp3

      - name: Convert transcript to natural news speech
        run: |
          python3 << 'EOF'
          import asyncio
          import edge_tts
          import os
          import re
          import requests
          from pydub import AudioSegment

          input_file = "ff-regioagenda.txt"
          newsbed_file = "newsbed.mp3"
          ting_file = "regio-ting.mp3"
          output_file = f"Focus-Regio-News-{os.environ['EDITION']}.mp3"

          voice = "nl-NL-FennaNeural"
          rate = "+2%"

          # ==========================================================
          # UITSPRAAK-LEXICON
          # Links: wat de DJ typt. Rechts: wat er uitgesproken wordt.
          # Hoofdletters maken niet uit. Nieuw woord nodig? Voeg een regel toe.
          # ==========================================================
          LEXICON = {
              # woorden die de stem verkeerd uitspreekt
              "files": "fajls",
              "file": "fajl",
              "e-mail": "iemeel",
              "email": "iemeel",
              "website": "websajt",
              "app": "ep",
              "workshop": "wurkshop",
              # afkortingen
              "bijv.": "bijvoorbeeld",
              "o.a.": "onder andere",
              "m.m.v.": "met medewerking van",
              "m.u.v.": "met uitzondering van",
              "i.v.m.": "in verband met",
              "t/m": "tot en met",
              "a.s.": "aanstaande",
              "enz.": "enzovoort",
              "ca.": "circa",
              "nr.": "nummer",
              "tel.": "telefoon",
              "evt.": "eventueel",
          }

          # Afkortingen in hoofdletters die als woord worden uitgesproken
          # (alle andere korte hoofdletterwoorden worden letter voor letter gelezen)
          ACRONIEM_ALS_WOORD = {"NAC", "NASA", "UEFA", "FIFA"}

          TLD = {
              "nl": "punt n l", "com": "punt com", "be": "punt b e",
              "org": "punt org", "eu": "punt e u", "net": "punt net",
              "de": "punt d e", "info": "punt info",
          }

          CIJFER = ["nul", "een", "twee", "drie", "vier",
                    "vijf", "zes", "zeven", "acht", "negen"]

          DOMEIN_RE = re.compile(
              r"\b(www\.)?((?:[A-Za-z0-9-]+\.)*[A-Za-z0-9-]+)\.(nl|com|be|org|eu|net|de|info)\b",
              re.IGNORECASE)
          EMAIL_RE = re.compile(
              r"([A-Za-z0-9._+-]+)@([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.(?:nl|com|be|org|eu|net|de|info))\b",
              re.IGNORECASE)

          def label_gesproken(label):
              # KWBN -> K W B N, anders gewoon kleine letters
              if label.isalpha() and label.isupper() and len(label) <= 6:
                  return " ".join(label)
              return label.lower().replace("-", " streepje ").replace("_", " underscore ")

          def domein_gesproken(m):
              delen = []
              if m.group(1):
                  delen.append("w w w punt")
              delen.append(" punt ".join(label_gesproken(x) for x in m.group(2).split(".")))
              delen.append(TLD[m.group(3).lower()])
              return " " + " ".join(delen) + " "

          def email_gesproken(m):
              lokaal = " punt ".join(label_gesproken(x) for x in m.group(1).split("."))
              domein = DOMEIN_RE.sub(domein_gesproken, m.group(2))
              return f" {lokaal} apenstaartje {domein} "

          def telefoon_gesproken(m):
              groepen = re.split(r"[ \-]", m.group(0))
              return ", ".join(" ".join(CIJFER[int(c)] for c in g) for g in groepen if g)

          def tijd_gesproken(m):
              uur, minuut = int(m.group(1)), int(m.group(2))
              return f"{uur} uur" if minuut == 0 else f"{uur} uur {minuut}"

          def euro_gesproken(m):
              euro, cent = m.group(1), m.group(2)
              if cent and cent != "00":
                  return f"{euro} euro {int(cent)}"
              return f"{euro} euro"

          def acroniem_gesproken(m):
              w = m.group(0)
              if w in ACRONIEM_ALS_WOORD:
                  return w
              if len(w) <= 5:
                  return " ".join(w)
              return w.lower()   # lange woorden in hoofdletters: gewoon als woord

          def normalize_for_tts(t):
              # 1. http(s):// weghalen
              t = re.sub(r"(?i)\bhttps?://", "", t)

              # 2. e-mailadressen en websites
              t = EMAIL_RE.sub(email_gesproken, t)
              t = DOMEIN_RE.sub(domein_gesproken, t)
              t = t.replace("@", " apenstaartje ")

              # 3. telefoonnummers cijfer voor cijfer
              t = re.sub(r"(?<!\d)0\d(?:[ \-]?\d){6,9}(?!\d)", telefoon_gesproken, t)

              # 4. tijden: 10.30 uur / 19:00 -> 10 uur 30 / 19 uur
              t = re.sub(r"\b(\d{1,2}):(\d{2})\b(?:\s*uur\b)?", tijd_gesproken, t)
              t = re.sub(r"\b(\d{1,2})\.(\d{2})\s*uur\b", tijd_gesproken, t)

              # 5. bedragen, kilometers, procenten
              t = re.sub(r"€\s*(\d+)(?:[.,](\d{2}))?", euro_gesproken, t)
              t = re.sub(r"(\d)\s*km\b\.?", r"\1 kilometer", t)
              t = re.sub(r"\s*%", " procent", t)
              t = t.replace("&", " en ")

              # 6. lexicon (langste sleutels eerst)
              for sleutel in sorted(LEXICON, key=len, reverse=True):
                  t = re.sub(r"(?<!\w)" + re.escape(sleutel) + r"(?!\w)",
                             LEXICON[sleutel], t, flags=re.IGNORECASE)

              # 7. afkortingen in hoofdletters: UMC -> U M C
              t = re.sub(r"\b[A-Z]{2,}\b", acroniem_gesproken, t)

              # 8. opruimen (regeleinden blijven intact)
              t = re.sub(r"[ \t]{2,}", " ", t)
              t = re.sub(r"[ \t]+([,.!?;:])", r"\1", t)
              t = re.sub(r"[ \t]+\n", "\n", t)
              return t

          print("Reading transcript...")

          with open(input_file, "r", encoding="utf-8") as f:
              text = f.read().strip()

          if not text:
              print("ERROR: Transcript is empty")
              exit(1)

          # De tekst kan markeringen "---TING---" bevatten: op die plek komt de pingel.
          segments = [x.strip() for x in re.split(r'(?m)^[ \t]*---TING---[ \t]*$', text) if x.strip()]
          segments = [normalize_for_tts(x) for x in segments]
          print("--- Tekst zoals die wordt uitgesproken (| = pingel) ---")
          print("\n|\n".join(segments))
          print("------------------------------------------")

          max_chars = 3000

          def make_chunks(text):
              chunks = []
              current_chunk = ""
              paragraphs = re.split(r'\n\s*\n', text)

              chunks = []
              current_chunk = ""
          
              for paragraph in paragraphs:
                  paragraph = paragraph.strip()
                  if not paragraph:
                      continue

                  if len(current_chunk) + len(paragraph) + 2 <= max_chars:
                      if current_chunk:
                          current_chunk += "\n\n"
                      current_chunk += paragraph
                  else:
                      if current_chunk:
                          chunks.append(current_chunk)

                      if len(paragraph) > max_chars:
                          sentences = re.split(r'(?<=[.!?])\s+', paragraph)
                          current_chunk = ""

                          for sentence in sentences:
                              if not sentence.strip():
                                  continue

                              if len(current_chunk) + len(sentence) + 1 <= max_chars:
                                  if current_chunk:
                                      current_chunk += " "
                                  current_chunk += sentence
                              else:
                                  if current_chunk:
                                      chunks.append(current_chunk)
                                  current_chunk = sentence
                      else:
                          current_chunk = paragraph

              if current_chunk:
                  chunks.append(current_chunk)
              return chunks

          # chunks: alle stukken in volgorde; ting_after: na welk stuk de pingel komt
          chunks = []
          ting_after = set()
          for si, seg in enumerate(segments):
              chunks.extend(make_chunks(seg))
              if si < len(segments) - 1:
                  ting_after.add(len(chunks) - 1)

          def get_proxies():
              proxies = []
              # Haal een lijst van publieke HTTPS/SOCKS proxies op om Azure IP-blokkades te omzeilen
              try:
                  res = requests.get("https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000&country=all&ssl=yes&anonymity=all", timeout=10)
                  if res.status_code == 200:
                      lines = [f"http://{p.strip()}" for p in res.text.splitlines() if p.strip()]
                      proxies.extend(lines[:20])
              except Exception as e:
                  print(f"Waarschuwing bij ophalen proxylijst: {e}")
              return proxies

          proxy_pool = get_proxies()

          async def generate_chunk_with_retry(text, filename):
              # Probeer eerst direct; probeer bij 403 / connectiefout roterende proxies
              attempts = [None] + proxy_pool
              for p in attempts:
                  try:
                      if p:
                          print(f"Poging via proxy: {p}")
                          communicate = edge_tts.Communicate(text, voice, rate=rate, proxy=p)
                      else:
                          communicate = edge_tts.Communicate(text, voice, rate=rate)
                      await communicate.save(filename)
                      return
                  except Exception as err:
                      print(f"Fout ({p if p else 'direct'}): {err}")
                      await asyncio.sleep(1)
              raise RuntimeError(f"Genereren van {filename} is mislukt via alle beschikbare verbindingen.")

          async def main():
              audio_parts = []

              for index, chunk in enumerate(chunks, start=1):
                  filename = f"tts_part_{index}.mp3"
                  print(f"Generating part {index}/{len(chunks)}...")
                  await generate_chunk_with_retry(chunk, filename)
                  audio_parts.append(filename)

              final_audio = AudioSegment.empty()
              pause = AudioSegment.silent(duration=350)

              ting = AudioSegment.from_mp3(ting_file) if os.path.exists(ting_file) else None
              if ting_after and ting is None:
                  print("WAARSCHUWING: regio-ting.mp3 niet gevonden, de pingels worden overgeslagen")
              ting_pause = AudioSegment.silent(duration=250)

              for index, filename in enumerate(audio_parts):
                  part = AudioSegment.from_mp3(filename)
                  if len(final_audio) > 0:
                      final_audio += (ting_pause if (ting is not None and (index - 1) in ting_after) else pause)
                  final_audio += part
                  if ting is not None and index in ting_after:
                      final_audio += ting_pause + ting

              if os.path.exists(newsbed_file):
                  newsbed = AudioSegment.from_mp3(newsbed_file)
                  while len(newsbed) < len(final_audio):
                      newsbed += newsbed
                  newsbed = newsbed[:len(final_audio)]
                  newsbed = newsbed - 15
                  final_audio = final_audio.overlay(newsbed)

              final_audio.export(output_file, format="mp3", bitrate="96k")

              for filename in audio_parts:
                  if os.path.exists(filename):
                      os.remove(filename)

          asyncio.run(main())

          print("✓ TTS generation complete!")
          print(f"✓ Output: {output_file}")
          EOF

      - name: Add ID3 tags to final MP3
        run: |
          python3 << 'EOF'
          from mutagen.id3 import ID3, TIT2, TALB, TPE1, APIC, ID3NoHeaderError

          import os
          mp3 = f"Focus-Regio-News-{os.environ['EDITION']}.mp3"
          cover = "FocusRegioAgenda.jpg"

          try:
              tags = ID3(mp3)
          except ID3NoHeaderError:
              tags = ID3()

          tags.add(TPE1(encoding=3, text="Focus-Regio-Agenda"))   # Artiest
          tags.add(TALB(encoding=3, text="Focus-Regio-Agenda"))   # Album
          tags.add(TIT2(encoding=3, text=f"Focus-Regio-Agenda editie {os.environ['EDITION']}"))   # Titel

          with open(cover, "rb") as img:
              tags.add(APIC(
                  encoding=3,
                  mime="image/jpeg",
                  type=3,
                  desc="Cover",
                  data=img.read()
              ))

          tags.save(mp3)
          print("✓ ID3 tags added successfully")
          EOF

      - name: Show output
        run: |
          echo "Generated audio:"
          ls -lh "Focus-Regio-News-${EDITION}.mp3"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          FILE="Focus-Regio-News-${EDITION}.mp3"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes to $FILE"
            exit 0
          fi
          git commit -m "Update: Focus Regio News editie ${EDITION}"
          # Beide edities kunnen tegelijk draaien: bij een botsing opnieuw proberen
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push mislukt, poging $i"
            sleep $((i * 3))
          done
          echo "ERROR: push mislukt"
          exit 1
