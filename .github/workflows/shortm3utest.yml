name: Daily EDM Top 10 Playlist

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual trigger

jobs:
  generate-playlist:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Generate EDM Top 10 Playlist
      env:
        # Optional: Add your Spotify Client ID/Secret if using Spotify API
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      run: |
        python3 << 'EOF'
        import json
        import requests
        from datetime import datetime
        
        # Example using a free music metadata API
        # You could also use Spotify API, Last.fm, or similar
        
        # For demonstration, we'll create a template
        # In production, replace with actual API calls
        
        playlist_content = []
        playlist_content.append("#EXTM3U")
        playlist_content.append(f"#EDM Top 10 - Generated on {datetime.now().strftime('%Y-%m-%d')}")
        
        # Example structure - replace with real API data
        sample_tracks = [
            {"artist": "Artist1", "title": "Track1", "duration": 180},
            {"artist": "Artist2", "title": "Track2", "duration": 210},
            # ... add 8 more tracks from your chosen API
        ]
        
        for track in sample_tracks:
            playlist_content.append(f"#EXTINF:{track['duration']},{track['artist']} - {track['title']}")
            # Note: For actual playback, you'd need streaming URLs from a licensed service
            playlist_content.append(f"stream://{track['artist']}/{track['title']}")
        
        with open('edm10.m3u', 'w', encoding='utf-8') as f:
            f.write('\n'.join(playlist_content))
        
        print("Playlist generated successfully!")
        EOF

    - name: Commit and push playlist
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add edm10.m3u
        git commit -m "Update EDM Top 10 playlist - $(date +%Y-%m-%d)" || exit 0
        git push
        
