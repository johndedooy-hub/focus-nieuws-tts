name: Process Nieuws Transcript

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl libxml2-utils python3 python3-pip
          python3 -m pip install --upgrade pip
          pip3 install -U openai-whisper

      - name: Download newest MP3 from RSS
        run: |
          RSS_URL="https://www.omnycontent.com/d/playlist/8257a063-6be9-42fa-b892-acd4013b1255/84d4de9f-8ca2-40c5-8d33-b0ce00d6f186/e4c79cb6-51a3-4c08-9573-b0ce00d746db/podcast.rss"
          AUDIO_URL=$(curl -sL "$RSS_URL" | xmllint --xpath 'string(//item[1]/enclosure/@url)' -)
          echo "Nieuwste MP3 URL: $AUDIO_URL"
          curl -L -s "$AUDIO_URL" -o raw_nieuws.mp3
          if [ ! -s raw_nieuws.mp3 ]; then
            echo "Download mislukt"
            exit 1
          fi

      - name: Transcribe audio with Whisper Medium
        run: |
          python3 - <<'PY'
import whisper
model = whisper.load_model("medium")
result = model.transcribe("raw_nieuws.mp3")
with open("nieuws.txt", "w", encoding="utf-8") as f:
    f.write(result.get("text", "").strip())
PY

      - name: Save transcript to repo
        run: |
          if [ -f nieuws.txt ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add nieuws.txt
            git commit -m "Update transcript nieuws" || true
            git push || true
          else
            echo "Geen transcript gevonden"
          fi
