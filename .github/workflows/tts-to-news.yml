name: Focus AIO News TTS

on:
  workflow_dispatch:

jobs:
  generate-news-audio:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pydub
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check transcript
        run: |
          if [ ! -f "Focus_Fantastique_tts.txt" ]; then
            echo "ERROR: Focus_Fantastique_tts.txt not found"
            exit 1
          fi

          echo "Transcript found:"
          ls -lh Focus_Fantastique_tts.txt

      - name: Convert transcript to natural news speech
        run: |
          python3 << 'EOF'
          import asyncio
          import edge_tts
          import os
          import re
          from pydub import AudioSegment

          input_file = "Focus_Fantastique_tts.txt"
          output_file = "Focus-AIO-News.mp3"

          # Nederlandse natuurlijke neurale stem
          voice = "nl-NL-FennaNeural"

          # Rustige, duidelijke nieuwsspraak
          rate = "-5%"
          pitch = "0Hz"

          print("Reading transcript...")

          with open(input_file, "r", encoding="utf-8") as f:
              text = f.read().strip()

          if not text:
              print("ERROR: Transcript is empty")
              exit(1)

          print(f"Characters: {len(text)}")
          print(f"Voice: {voice}")
          print(f"Rate: {rate}")

          # Maak nette tekstblokken.
          # Lange teksten worden opgesplitst zodat Edge TTS
          # betrouwbaar kan worden verwerkt.
          paragraphs = re.split(r'\n\s*\n', text)

          chunks = []
          current_chunk = ""

          max_chars = 3000

          for paragraph in paragraphs:
              paragraph = paragraph.strip()

              if not paragraph:
                  continue

              if len(current_chunk) + len(paragraph) + 2 <= max_chars:
                  if current_chunk:
                      current_chunk += "\n\n"
                  current_chunk += paragraph
              else:
                  if current_chunk:
                      chunks.append(current_chunk)

                  # Als één alinea zelf te lang is,
                  # splitsen we hem op zinnen.
                  if len(paragraph) > max_chars:
                      sentences = re.split(
                          r'(?<=[.!?])\s+',
                          paragraph
                      )

                      current_chunk = ""

                      for sentence in sentences:
                          if not sentence.strip():
                              continue

                          if (
                              len(current_chunk)
                              + len(sentence)
                              + 1
                              <= max_chars
                          ):
                              if current_chunk:
                                  current_chunk += " "
                              current_chunk += sentence
                          else:
                              if current_chunk:
                                  chunks.append(current_chunk)

                              current_chunk = sentence

                  else:
                      current_chunk = paragraph

          if current_chunk:
              chunks.append(current_chunk)

          print(f"Number of TTS chunks: {len(chunks)}")

          async def generate_chunk(text, filename):
              communicate = edge_tts.Communicate(
                  text,
                  voice,
                  rate=rate,
                  pitch=pitch
              )
              await communicate.save(filename)

          async def main():
              audio_parts = []

              for index, chunk in enumerate(chunks, start=1):
                  filename = f"tts_part_{index}.mp3"

                  print(
                      f"Generating part {index}/{len(chunks)}..."
                  )

                  await generate_chunk(chunk, filename)

                  audio_parts.append(filename)

              print("Combining audio...")

              final_audio = AudioSegment.empty()

              # Kleine natuurlijke pauze tussen nieuwsblokken
              pause = AudioSegment.silent(duration=350)

              for index, filename in enumerate(audio_parts):
                  part = AudioSegment.from_mp3(filename)

                  if len(final_audio) > 0:
                      final_audio += pause

                  final_audio += part

              print("Exporting final MP3...")

              final_audio.export(
                  output_file,
                  format="mp3",
                  bitrate="128k"
              )

              # Tijdelijke bestanden verwijderen
              for filename in audio_parts:
                  if os.path.exists(filename):
                      os.remove(filename)

          asyncio.run(main())

          print("✓ TTS generation complete!")
          print(f"✓ Output: {output_file}")
          EOF

      - name: Show output
        run: |
          echo "Generated audio:"
          ls -lh Focus-AIO-News.mp3

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        run: |
          if git diff --quiet Focus-AIO-News.mp3; then
            echo "No changes to Focus-AIO-News.mp3"
          else
            git add Focus-AIO-News.mp3
            git commit -m "Update: Focus AIO News"
            git push
          fi
          
